{% load static %}
<html>
<head>

    <link rel="stylesheet" type="text/css" href="{% static '/login.css' %}">
</head>
<body>
<div class="container">
    <div class="row mt-5">
        <div class="col-md-6 offset-md-3">

            </div>
        </div>
    </div>
</div>

</body>
</html>
