{% load static %}


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Event</title>
  <link rel="stylesheet" href="{% static 'style.css' %}" />
 <style>
  input, textarea, button, select {
    display: block;
    margin: 10px 0;
    padding: 8px;
    width: 100%;
    background-color: #3b0a54;
    color: #fff;
    border: 2px solid gold;
    border-radius: 8px;
  }
  option {
    background-color: #3b0a54;
    color: white;
  }
  .info-list li {
    margin-bottom: 8px;
  }
  .info-list button {
    margin-left: 8px;
  }
</style>

</head>
<body>
  <header class="main-header">
    <h1>👑 Manage Event👑</h1>
    <p class="shimmer">Organize with Grace</p>
  </header>
  <div class="back-link">
    <a id="backLink" href="{% url 'organizer-dashboard' %}">← Back to Events</a>
  </div>

  <div class="container">
    <main class="content">
      <!-- Event Details -->
      <section class="card">
        <h2>Event Details</h2>
        <input id="eventName" placeholder="Pageant Name">
        <input id="eventDate" type="date">
        <input id="eventVenue" placeholder="Venue">
        <textarea id="eventDesc" placeholder="Description"></textarea>
        <button class="manage-btn" onclick="saveEventDetails()">Save Event Details</button>
      </section>

      <!-- Segments -->
      <section class="card">
        <h2>Segments</h2>
        <input id="segmentName" placeholder="Segment Name">
        <input id="segmentStart" type="time" placeholder="Start Time">
        <input id="segmentEnd" type="time" placeholder="End Time">
        <input id="segmentWeight" type="number" placeholder="Scoring Weight %">
        <button class="manage-btn" onclick="addSegment()">Add Segment</button>
        <ul id="segmentList" class="info-list"></ul>
      </section>

     <!-- Judges -->
<section class="card">
  <h2>Judges</h2>
  <input id="judgeName" placeholder="Judge Name">
  <input id="judgeTitle" placeholder="Title">
  <input id="judgeImage" type="file" accept="image/*">
  <button class="manage-btn" onclick="addJudge()">Add Judge</button>
  <ul id="judgeList" class="info-list"></ul>
</section>


      <!-- Participants -->
      <section class="card">
        <h2>Participants</h2>
        <input id="participantName" placeholder="Name">
        <input id="participantGender" placeholder="Gender">
        <input id="participantBirthday" type="date" placeholder="Birthday">
        <input id="participantAge" type="number" placeholder="Age">
        <input id="participantCourse" placeholder="Course">
        <input id="participantDepartment" placeholder="Department">
        <textarea id="participantBio" placeholder="Short Biography"></textarea>
        <input id="participantImage" type="file" accept="image/*">
       <button id="addParticipantBtn" onclick="addParticipant()">Add Participant</button>
        <ul id="participantList" class="info-list"></ul>
      </section>

      <!-- Criteria per Segment -->
      <section class="card">
        <h2>Criteria</h2>
        <select id="criteriaSegmentSelect">
          <option value="">-- Select Segment --</option>
        </select>
        <input id="criteriaName" placeholder="Criterion Name">
        <input id="criteriaWeight" type="number" placeholder="Weight %">
        <button class="manage-btn" onclick="addCriteria()">Add Criterion</button>
        <ul id="criteriaList" class="info-list"></ul>
      </section>
    </main>
  </div>
<script>
window.addEventListener('DOMContentLoaded', () => {
  const urlParams = new URLSearchParams(window.location.search);
  const storageKey = 'pageantEvents';
  let events = JSON.parse(sessionStorage.getItem(storageKey)) || [];
  let eventIndex = parseInt(urlParams.get('event'), 10);

  if (isNaN(eventIndex) || !events[eventIndex]) {
    eventIndex = events.length;
    events.push({
      name: '', date: '', venue: '', description: '',
      participants: [], segments: [], judges: []
    });
    sessionStorage.setItem(storageKey, JSON.stringify(events));
    window.history.replaceState({}, '', `?event=${eventIndex}`);
  }

  let data = events[eventIndex];

  function saveAndSync() {
    events[eventIndex] = data;
    sessionStorage.setItem(storageKey, JSON.stringify(events));
  }

  function updateList(listId, items, type) {
    const ul = document.getElementById(listId);
    ul.innerHTML = '';
    items.forEach((item, index) => {
      let text = '';
      if (type === 'participant') {
        const imgHTML = item.image
          ? `<img src="${item.image}" alt="Participant" style="height:40px;width:40px;border-radius:50%;vertical-align:middle;margin-right:8px;">`
          : '';
        text = `${imgHTML}${item.name}, ${item.gender}, ${item.age} y/o, ${item.course}, ${item.department}`;
        ul.innerHTML += `<li>${text} <button onclick="editParticipant(${index})">Edit</button> <button onclick="deleteParticipant(${index})">Delete</button></li>`;
      } else if (type === 'segment') {
        text = `${item.name} (${item.weight}%)`;
        ul.innerHTML += `<li>${text} <button onclick="editSegment(${index})">Edit</button> <button onclick="deleteSegment(${index})">Delete</button></li>`;
      } else if (type === 'judge') {
        const imgHTML = item.image ? `<img src="${item.image}" alt="Judge" style="height:40px;width:40px;border-radius:50%;vertical-align:middle;margin-right:8px;">` : '';
        text = `${imgHTML}${item.name} – ${item.title}`;
        ul.innerHTML += `<li>${text} <button onclick="editJudge(${index})">Edit</button> <button onclick="deleteJudge(${index})">Delete</button></li>`;
      }
    });
  }

  window.saveEventDetails = function () {
    data.name = document.getElementById('eventName').value;
    data.date = document.getElementById('eventDate').value;
    data.venue = document.getElementById('eventVenue').value;
    data.description = document.getElementById('eventDesc').value;
    saveAndSync();
    alert('Event details saved!');
  };

  window.addSegment = function () {
    const s = {
      name: document.getElementById('segmentName').value,
      start: document.getElementById('segmentStart').value,
      end: document.getElementById('segmentEnd').value,
      weight: parseFloat(document.getElementById('segmentWeight').value),
      criteria: []
    };
    data.segments.push(s);
    updateList('segmentList', data.segments, 'segment');
    refreshSegmentSelector();
    saveAndSync();
  };

  window.editSegment = function(index) {
    const s = data.segments[index];
    document.getElementById('segmentName').value = s.name;
    document.getElementById('segmentStart').value = s.start;
    document.getElementById('segmentEnd').value = s.end;
    document.getElementById('segmentWeight').value = s.weight;
    data.segments.splice(index, 1);
    updateList('segmentList', data.segments, 'segment');
    refreshSegmentSelector();
    saveAndSync();
  };

  window.deleteSegment = function(index) {
    if (confirm("Are you sure you want to delete this segment?")) {
      data.segments.splice(index, 1);
      updateList('segmentList', data.segments, 'segment');
      refreshSegmentSelector();
      saveAndSync();
    }
  };

  function refreshSegmentSelector() {
    const select = document.getElementById('criteriaSegmentSelect');
    select.innerHTML = '<option value="">-- Select Segment --</option>';
    data.segments.forEach((seg, i) => {
      const option = document.createElement('option');
      option.value = i;
      option.textContent = seg.name;
      select.appendChild(option);
    });
  }

  window.addCriteria = function () {
    const segIndex = document.getElementById('criteriaSegmentSelect').value;
    if (segIndex === "") return alert("Please select a segment first.");

    const c = {
      name: document.getElementById('criteriaName').value,
      weight: parseFloat(document.getElementById('criteriaWeight').value)
    };

    data.segments[segIndex].criteria.push(c);
    updateCriteriaList(segIndex);
    saveAndSync();
  };

  function updateCriteriaList(segmentIndex) {
    const ul = document.getElementById('criteriaList');
    ul.innerHTML = '';
    const criteria = data.segments[segmentIndex].criteria || [];
    criteria.forEach((c, index) => {
      const li = document.createElement('li');
      li.innerHTML = `${c.name} – ${c.weight}% <button onclick="deleteCriteria(${segmentIndex}, ${index})">Delete</button>`;
      ul.appendChild(li);
    });
  }

  window.deleteCriteria = function(segmentIndex, critIndex) {
    if (confirm("Delete this criterion?")) {
      data.segments[segmentIndex].criteria.splice(critIndex, 1);
      updateCriteriaList(segmentIndex);
      saveAndSync();
    }
  };

  document.getElementById('criteriaSegmentSelect').addEventListener('change', function () {
    const index = this.value;
    if (index !== "") updateCriteriaList(index);
  });
window.addJudge = function () {
  const name = document.getElementById('judgeName').value;
  const title = document.getElementById('judgeTitle').value;
  const file = document.getElementById('judgeImage').files[0];

  if (file) {
    resizeImage(file, function (compressedImage) {
      const j = { name, title, image: compressedImage };
      data.judges.push(j);
      updateList('judgeList', data.judges, 'judge');
      saveAndSync();
    });
  } else {
    const j = { name, title, image: '' };
    data.judges.push(j);
    updateList('judgeList', data.judges, 'judge');
    saveAndSync();
  }
};


  window.editJudge = function(index) {
    const j = data.judges[index];
    document.getElementById('judgeName').value = j.name;
    document.getElementById('judgeTitle').value = j.title;
    // Note: Image can't be pre-filled due to browser limitations
    data.judges.splice(index, 1);
    updateList('judgeList', data.judges, 'judge');
    saveAndSync();
  };

  window.deleteJudge = function(index) {
    if (confirm("Are you sure you want to delete this judge?")) {
      data.judges.splice(index, 1);
      updateList('judgeList', data.judges, 'judge');
      saveAndSync();
    }
  };

  // Resize image function before saving to reduce size
  function resizeImage(file, callback) {
    const reader = new FileReader();
    reader.onload = function (event) {
      const img = new Image();
      img.onload = function () {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        // Resize logic: max 200px width or height
        const maxSize = 200;
        let width = img.width;
        let height = img.height;

        if (width > height) {
          if (width > maxSize) {
            height *= maxSize / width;
            width = maxSize;
          }
        } else {
          if (height > maxSize) {
            width *= maxSize / height;
            height = maxSize;
          }
        }

        canvas.width = width;
        canvas.height = height;
        ctx.drawImage(img, 0, 0, width, height);

        // Compress to jpeg quality 0.6 to reduce size
        const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
        callback(dataUrl);
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  }

  window.addParticipant = function () {
    const name = document.getElementById('participantName').value;
    const gender = document.getElementById('participantGender').value;
    const birthday = document.getElementById('participantBirthday').value;
    const age = parseInt(document.getElementById('participantAge').value);
    const course = document.getElementById('participantCourse').value;
    const department = document.getElementById('participantDepartment').value;
    const bio = document.getElementById('participantBio').value;
    const file = document.getElementById('participantImage').files[0];

    if (file) {
      resizeImage(file, function (compressedImage) {
        const p = { name, gender, birthday, age, course, department, bio, image: compressedImage };
        data.participants.push(p);
        updateList('participantList', data.participants, 'participant');
        saveAndSync();
        clearParticipantForm();
      });
    } else {
      const p = { name, gender, birthday, age, course, department, bio, image: '' };
      data.participants.push(p);
      updateList('participantList', data.participants, 'participant');
      saveAndSync();
      clearParticipantForm();
    }
  };

  function clearParticipantForm() {
    document.getElementById('participantName').value = '';
    document.getElementById('participantGender').value = '';
    document.getElementById('participantBirthday').value = '';
    document.getElementById('participantAge').value = '';
    document.getElementById('participantCourse').value = '';
    document.getElementById('participantDepartment').value = '';
    document.getElementById('participantBio').value = '';
    document.getElementById('participantImage').value = '';
  }

  window.editParticipant = function(index) {
    const p = data.participants[index];
    document.getElementById('participantName').value = p.name;
    document.getElementById('participantGender').value = p.gender;
    document.getElementById('participantBirthday').value = p.birthday;
    document.getElementById('participantAge').value = p.age;
    document.getElementById('participantCourse').value = p.course;
    document.getElementById('participantDepartment').value = p.department;
    document.getElementById('participantBio').value = p.bio;

    data.participants.splice(index, 1);
    updateList('participantList', data.participants, 'participant');
    saveAndSync();
  };

  window.deleteParticipant = function(index) {
    if (confirm("Are you sure you want to delete this participant?")) {
      data.participants.splice(index, 1);
      updateList('participantList', data.participants, 'participant');
      saveAndSync();
    }
  };

  // Populate existing data
  document.getElementById('eventName').value = data.name || '';
  document.getElementById('eventDate').value = data.date || '';
  document.getElementById('eventVenue').value = data.venue || '';
  document.getElementById('eventDesc').value = data.description || '';
  updateList('segmentList', data.segments, 'segment');
  updateList('judgeList', data.judges, 'judge');
  updateList('participantList', data.participants, 'participant');
  refreshSegmentSelector();
});
</script>


</body>
</html>
