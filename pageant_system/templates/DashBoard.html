{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organizer Dashboard - Pageant Scoring System</title>
  <link rel="stylesheet" href="{% static 'style.css' %}" />
</head>
<body>
  <header class="main-header">
    <h1>👑 SagiSaya 👑</h1>
    <p class="shimmer">To crown with joy</p>
  </header>

  <div class="container">
    <aside class="sidebar">
      <div class="organizer-panel">
        <h2>Organizer Panel</h2>
    
        &nbsp;
        <nav class="nav-links">
          <a href="{% url 'organizer-dashboard' %}">My Events</a>
          <a href="{% url 'organizer-profile' %}">Profile</a>
          <a href="{% url 'organizer-score' %}">Score</a>
          <a href="{% url 'organizer-ranking' %}">Ranking</a>

           <a href="{% url 'login' %}">Logout</a>

        </nav>
      </div>
    </aside>

    
&nbsp;&nbsp;
    <main class="content">
     &nbsp;
      <h2>My Pageant Events</h2>
       &nbsp;
        &nbsp;
      <div id="event-list" class="event-list"></div>

      <!-- Create New Event Card -->
      <div class="card">
        <h3>Create New Event</h3>
        <label>Event Name: <input type="text" id="eventName" /></label>
        <label>Date: <input type="date" id="eventDate" /></label>
        <label>Venue: <input type="text" id="eventVenue" /></label>
        <label>Description: <textarea id="eventDescription"></textarea></label>
        <button class="manage-btn" onclick="addEvent()">Create Event</button>
      </div>
    </main>
  </div>

  
  <script>
  const storageKey = 'pageantEvents';

  function loadEvents() {
    const list = document.getElementById('event-list');
    list.innerHTML = '';
    const events = JSON.parse(sessionStorage.getItem(storageKey)) || [];

    events.forEach((event, index) => {
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = `
        <h3>${event.name}</h3>
        <p><strong>Date:</strong> ${event.date}</p>
        <p><strong>Venue:</strong> ${event.venue}</p>
        <p><strong>Description:</strong> ${event.description}</p>
        <a href="{% url 'manage-event' %}?event=${index}" class="manage-btn">Manage</a>
      `;
      list.appendChild(div);
    });
  }

  function addEvent() {
    const name = document.getElementById('eventName').value;
    const date = document.getElementById('eventDate').value;
    const venue = document.getElementById('eventVenue').value;
    const description = document.getElementById('eventDescription').value;

    if (!name || !date || !venue || !description) {
      alert("Please fill out all fields.");
      return;
    }

    const newEvent = { name, date, venue, description, participants: [], segments: [], judges: [], criteria: [] };
    const events = JSON.parse(sessionStorage.getItem(storageKey)) || [];
    events.push(newEvent);
    sessionStorage.setItem(storageKey, JSON.stringify(events));

    document.getElementById('eventName').value = '';
    document.getElementById('eventDate').value = '';
    document.getElementById('eventVenue').value = '';
    document.getElementById('eventDescription').value = '';

    loadEvents();
  }

  window.onload = loadEvents;
</script>
