{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Score - Pageant Scoring System</title>
  <link rel="stylesheet" href="{% static 'style.css' %}" />
</head>
<body>
  <header class="main-header">
    <h1>👑 SagiSaya 👑</h1>
    <p class="shimmer">To crown with joy</p>
  </header>

<div class="container">
    <aside class="sidebar">
      <div class="organizer-panel">
        <h2>Organizer Panel</h2>

        &nbsp;
            <nav class="nav-links">
          <a href="{% url 'organizer-dashboard' %}">My Events</a>
          <a href="{% url 'organizer-profile' %}">Profile</a>
          <a href="{% url 'organizer-score' %}">Score</a>
          <a href="{% url 'organizer-ranking' %}">Ranking</a>
           <a href="{% url 'login' %}">Logout</a>

          
        </nav>
      </div>
    </aside>

    <main class="content">
       &nbsp;
      <h2>My Pageant Events</h2>
       &nbsp;
        &nbsp;
      <div id="event-list" class="event-list"></div>
    </main>
  </div>

  <script>
    const storageKey = 'pageantEvents';

    function loadJudgeEvents() {
      const container = document.getElementById('event-list');
      container.innerHTML = '';
      const events = JSON.parse(sessionStorage.getItem(storageKey)) || [];

      events.forEach((event, index) => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
          <h3>${event.name}</h3>
          <p><strong>Date:</strong> ${event.date}</p>
          <p><strong>Venue:</strong> ${event.venue}</p>
          <p><strong>Description:</strong> ${event.description}</p>
          <a href="{% url 'organizer-score-participant' %}?event=${index}" class="manage-btn">View Judges and Scores</a>
        `;
        container.appendChild(div);
      });
    }

    window.onload = loadJudgeEvents;
  </script>
</body>
</html>
