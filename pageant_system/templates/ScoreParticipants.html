{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Participants</title>
  <link rel="stylesheet" href="{% static 'style.css' %}" />
</head>
<body>
  <header class="main-header">
    <h1>👑 Participants 👑</h1>
    <p class="shimmer">Meet the Stars</p>
  </header>

  &nbsp;
  
  &nbsp;
  <!-- Judges Section -->
  <section class="judges-section" id="judgesSection">
    <h2>Judges for this event</h2>
    <div id="judgesContainer"></div>
  </section>

  <div class="back-link">
    <a id="backLink" href="{% url 'organizer-score' %}">← Back to Events</a>
  </div>

  <div class="container">
    <main id="participantContainer"></main>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const eventIndex = parseInt(urlParams.get('event'), 10);
      const events = JSON.parse(sessionStorage.getItem('pageantEvents')) || [];
      const scores = JSON.parse(sessionStorage.getItem('pageantScores')) || {};

      if (isNaN(eventIndex) || !events[eventIndex]) {
        alert("⚠️ Event not found.");
        return;
      }

      const event = events[eventIndex];
      document.getElementById('backLink').href = `{% url 'organizer-score' %}?event=${eventIndex}`;

      const judgesContainer = document.getElementById('judgesContainer');
      judgesContainer.innerHTML = '';

      if (event.judges && event.judges.length > 0) {
        event.judges.forEach(j => {
          const card = document.createElement('div');
          card.className = 'judge-card';
          card.innerHTML = `
            <img src="${j.image || 'placeholder.jpg'}" alt="${j.name}">
            <p><strong>${j.name}</strong></p>
            <p>${j.title}</p>
          `;
          judgesContainer.appendChild(card);
        });
      } else {
        document.getElementById('judgesSection').style.display = 'none';
      }

      const container = document.getElementById('participantContainer');
      container.innerHTML = '';

      if (!event.participants || event.participants.length === 0) {
        container.innerHTML = '<p>No participants added yet.</p>';
        return;
      }

      event.participants.forEach(p => {
        const card = document.createElement('div');
        card.className = 'participant-card';

        const participantName = encodeURIComponent(p.name);
        const decodedName = p.name;

        let totalScore = 0;
        if (event.segments && event.segments.length > 0) {
          event.segments.forEach(segment => {
            const segmentScoreObj = scores?.[eventIndex]?.[decodedName]?.[segment.name];
            if (segmentScoreObj && typeof segmentScoreObj.weightedScore === 'number') {
              const weightFactor = segment.weight / 100;
              totalScore += segmentScoreObj.weightedScore * weightFactor;
            }
          });
        }

        card.innerHTML = `
          <div class="image-portrait">
            <img src="${p.image || 'placeholder.jpg'}" alt="${p.name}">
          </div>
          <div class="card-body">
            <h3>${p.name}</h3>
            <p>Gender: ${p.gender}</p>
            <p>Age: ${p.age}</p>
            <p>Course: ${p.course}</p>
            <p>Department: ${p.department}</p>
            <p>${p.bio}</p>
            <p><strong>Total Score:</strong> ${totalScore.toFixed(2)}</p>
            <a href="{% url 'organizer-score-segment' %}?event=${eventIndex}&participant=${participantName}" class="score-btn">View Scores</a>
          </div>
        `;
        container.appendChild(card);
      });
    });
  </script>
</body>
</html>
