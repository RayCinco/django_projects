{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Segments</title>
  <link rel="stylesheet" href="{% static 'style.css' %}">
  <style>
    .card {
      background: linear-gradient(to right, #2c003e, #4b0082);
      padding: 1rem;
      margin: 1rem 0;
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }
    .container { padding: 2rem; }
  </style>
</head>
<body>
  <header class="main-header">
    <h1>👑 Segments 👑</h1>
  </header>
  <div class="container">
    <main class="content">
      <h2>Select Segment to Score</h2>
      <div id="segmentContainer"></div>
    </main>
    <div class="back-link">
      <a id="backLink" href="#">← Back to Participants</a>
    </div>
  </div>

<script>
const params = new URLSearchParams(window.location.search);
const eventIndex = params.get('event');
const participant = params.get('participant');
const events = JSON.parse(sessionStorage.getItem('pageantEvents')) || [];
const data = events[eventIndex];
const scores = JSON.parse(sessionStorage.getItem('pageantScores')) || {};
const container = document.getElementById('segmentContainer');

document.getElementById('backLink').href = "{% url 'participants' %}" + `?event=${eventIndex}`;

if (data && data.segments && data.segments.length > 0) {
  data.segments.forEach(seg => {
    const segmentScores = scores?.[eventIndex]?.[participant]?.[seg.name] || {};
    const segmentWeighted = segmentScores?.weightedScore || 0;
    const finalScore = (segmentWeighted * (seg.weight / 100)).toFixed(3);

    const div = document.createElement('div');
    div.className = 'card';
    div.onclick = () => location.href = "{% url 'criteria' %}" + `?event=${eventIndex}&participant=${encodeURIComponent(participant)}&segment=${encodeURIComponent(seg.name)}`;
    div.innerHTML = `
      <h3>${seg.name}</h3>
      <p><strong>Time:</strong> ${seg.start} – ${seg.end}</p>
      <p><strong>Weight:</strong> ${seg.weight}%</p>
      <p><strong>Segment Score:</strong> ${segmentWeighted.toFixed(2)} / 10</p>
      <p><strong>Final Weighted Score:</strong> ${finalScore} toward final</p>
    `;
    container.appendChild(div);
  });
} else {
  container.innerHTML = '<p>No segments found. Please add them in Manage Event.</p>';
}
</script>
</body>
</html>
